[project]
name = "threat-intel-graph"
version = "0.1.0"
description = "A STIX-2.1 threat-intelligence graph with collectors, analytics, export and an LLM narrator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy", email = "vincent.plessy12@gmail.com" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tig"]
omit = ["tig/api.py", "tig/graph/neo4j_store.py"]
