<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Threat Intel Graph</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Threat&nbsp;Intel&nbsp;Graph</div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="color-community" /> colour by community</label>
      <button id="central-btn" title="Highlight top nodes by PageRank">Central nodes</button>
      <span id="stats" class="stats"></span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>Filter node types</h3>
      <div id="type-filters" class="filters"></div>
      <h3>Detail</h3>
      <div id="detail" class="detail">
        <p class="muted">Click a node to inspect it, export a STIX bundle, or generate a campaign narrative.</p>
      </div>
    </aside>
    <main class="canvas">
      <svg id="graph"></svg>
    </main>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
